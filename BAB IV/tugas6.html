
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Tugas 6 - HTML5 Lanjutan</title>
</head>
<body>

    <h1>Desain Web HTML5</h1>

    <!-- 6.2 Tugas -->
    <h2>Menu Audio, Video, dan Maps</h2>

    <!-- Menu Audio -->
    <h3>Audio</h3>
    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Browser Anda tidak mendukung audio.
    </audio>

    <!-- Menu Video -->
    <h3>Video</h3>
    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
        Browser Anda tidak mendukung video.
    </video>

    <!-- Menu Maps -->
    <h3>Maps</h3>
    <iframe
        src="https://maps.google.com/maps?q=Yogyakarta&t=&z=13&ie=UTF8&iwloc=&output=embed"
        width="600"
        height="400">
    </iframe>

</body>
</html>
