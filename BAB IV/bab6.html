

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Bab 6 - HTML5 Lanjutan</title>
</head>
<body>

    <h1>BAB VI HTML5 LANJUTAN</h1>

    <!-- 6.1.1 Maps -->
    <h2>6.1.1 Maps</h2>
    <h3>Google Map Pertama</h3>
    <div id="peta" style="width:100%;height:400px;"></div>

    <script>
    function myMap() {
        var mapProp = {
            center: new google.maps.LatLng(51.508742,-0.120850),
            zoom: 5,
        };
        var map = new google.maps.Map(
            document.getElementById("peta"), mapProp
        );
    }
    </script>

    <script src="https://maps.googleapis.com/maps/api/js?key=API_KEY_KAMU&callback=myMap"></script>

    <!-- 6.1.2 Video -->
    <h2>6.1.2 Video</h2>
    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
    </video>

    <!-- 6.1.3 Audio -->
    <h2>6.1.3 Audio</h2>
    <audio controls>
        <source src="audio.ogg" type="audio/ogg">
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <!-- 6.1.4 YouTube -->
    <h2>6.1.4 YouTube</h2>
    <iframe width="420" height="345"
        src="https://www.youtube.com/embed/XGSy3_Czz8k?autoplay=0">
    </iframe>

    <!-- 6.1.5 Plug-in -->

    <!-- 6.1.5.1 Elemen object -->
    <h2>6.1.5.1 Elemen Object</h2>
    <object width="400" height="50"
        data="file.pdf"></object>

    <!-- 6.1.5.2 Elemen embed -->
    <h2>6.1.5.2 Elemen Embed</h2>
    <embed width="400" height="50" src="file.pdf">

</body>
</html>
