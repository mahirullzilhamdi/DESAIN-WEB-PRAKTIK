
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Latihan 5.4 HTML5</title>
</head>
<body>

    <h1>Latihan 5.4 HTML5</h1>

    <!-- 5.4.1 Contoh Canvas -->
    <p>Pilih gambar:</p>
    <input type="file" id="pilihGambar" accept="image/*">

    <p>Mengisi:</p>
    <canvas id="kanvas" width="250" height="300"
        style="border:1px solid #d3d3d3;">
        Browser tidak mendukung HTML5 Canvas.
    </canvas>

    <p>
        <button onclick="kanvasGambar()">Try it</button>
    </p>

    <img id="gambar" src="" alt="Gambar pilihan"
        width="220" height="277" style="display:none;">

    <script>
        function kanvasGambar() {
            const canvas = document.getElementById("kanvas");
            const ctx = canvas.getContext("2d");
            const img = document.getElementById("gambar");
            const file = document.getElementById("pilihGambar").files[0];

            if (!file) {
                alert("Pilih gambar terlebih dahulu.");
                return;
            }

            const url = URL.createObjectURL(file);

            img.onload = function () {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 10, 10);
                URL.revokeObjectURL(url);
            };

            img.onerror = function () {
                alert("Gambar gagal dibuka.");
                URL.revokeObjectURL(url);
            };

            img.src = url;
        }
    </script>

    <hr>

    <!-- 5.4.2.1 SVG Circle -->
    <h2>SVG Circle</h2>

    <svg width="100" height="100">
        <circle cx="50" cy="50" r="40"
            stroke="red" stroke-width="4" fill="blue" />
    </svg>

    <hr>

    <!-- 5.4.2.2 SVG Rectangle -->
    <h2>SVG Rectangle</h2>

    <svg width="400" height="100">
        <rect width="400" height="100"
            style="fill:rgb(255,255,0);
                   stroke-width:10;
                   stroke:rgb(0,255,0);" />
    </svg>

    <hr>

    <!-- 5.4.2.3 SVG Rounded Rectangle -->
    <h2>SVG Rounded Rectangle</h2>

    <svg width="400" height="400">
        <rect x="50" y="20" rx="20" ry="20"
            width="300" height="300"
            style="fill:red;
                   stroke:black;
                   stroke-width:5;
                   opacity:0.5;" />
    </svg>

    <hr>

    <!-- 5.4.2.4 SVG Star -->
    <h2>SVG Star</h2>

    <svg width="300" height="200">
        <polygon
            points="100,10 40,198 190,78 10,78 160,198"
            style="fill:black;
                   stroke:red;
                   stroke-width:5;
                   fill-rule:evenodd;" />
    </svg>

    <hr>

    <!-- 5.4.2.5 SVG Logo -->
    <h2>SVG Logo</h2>

    <svg height="130" width="500">
        <defs>
            <linearGradient id="grad1"
                x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%"
                    style="stop-color:rgb(255,255,0);
                           stop-opacity:1" />
                <stop offset="100%"
                    style="stop-color:rgb(255,0,255);
                           stop-opacity:1" />
            </linearGradient>
        </defs>

        <ellipse cx="100" cy="70" rx="85" ry="55"
            fill="url(#grad1)" />

        <text fill="green" font-size="45"
            font-family="Arial" x="50" y="86">
            UTY
        </text>
    </svg>

</body>
</html>
